<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéView - {% block title %}Explorador Pokémon{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .type-badge { @apply inline-block px-3 py-1 rounded-full text-white text-sm font-semibold shadow; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
    <nav class="bg-white dark:bg-gray-800 shadow-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="{% url 'home' %}" class="text-2xl font-bold text-red-500 dark:text-red-400">
                    ⚡ PokéView
                </a>
                <div class="flex items-center gap-4">
                    <a href="{% url 'home' %}" class="hover:text-red-500 transition">Inicio</a>
                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' %}" class="hover:text-red-500 transition">{{ user.username }}</a>
                        <a href="{% url 'logout' %}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition">Cerrar Sesión</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="hover:text-red-500 transition">Iniciar Sesión</a>
                        <a href="{% url 'register' %}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition">Registrarse</a>
                    {% endif %}
                    <button id="dark-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition" title="Alternar modo oscuro">
                        <span id="dark-icon">🌙</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        const html = document.documentElement;
        const toggle = document.getElementById('dark-toggle');
        const icon = document.getElementById('dark-icon');

        if (localStorage.getItem('dark') === 'false') {
            html.classList.remove('dark');
            icon.textContent = '☀️';
        }

        toggle.addEventListener('click', () => {
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('dark', isDark);
            icon.textContent = isDark ? '🌙' : '☀️';
        });
    </script>
</body>
</html>
